<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Duck AR</title>
    <style>
      html, body { margin: 0; height: 100%; background: #eef3f6; overflow: hidden; }
      body { font: 14px/1.4 system-ui, sans-serif; color: #16242d; }
      [hidden] { display: none !important; } /* id rules below set display:flex and would override it */
      #app { position: fixed; inset: 0; }
      button { font: 700 15px system-ui, sans-serif; padding: 12px 18px; border: 0; border-radius: 12px;
        background: #e8731a; color: #fff; }
      button.alt { background: rgba(255,255,255,.92); color: #16242d; }
      button:disabled { opacity: .5; }
      .chip { padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.88); }

      /* normal 3D viewer */
      #viewer { position: fixed; inset: 0; pointer-events: none; padding: 16px; box-sizing: border-box;
        padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; justify-content: space-between; }
      #viewer > * { pointer-events: auto; }
      #clips { display: flex; gap: 8px; flex-wrap: wrap; }
      #viewer .bottom { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

      /* AR overlay (WebXR dom-overlay root) */
      #overlay { position: fixed; inset: 0; pointer-events: none; box-sizing: border-box; padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; justify-content: space-between; }
      #overlay[hidden] { display: none; }
      #overlay > * { pointer-events: auto; }
      #hint { align-self: center; text-align: center; }
      /* photo mode: nothing visible except a faint corner button that brings the UI back */
      #show-ui { display: none; position: absolute; right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom)); padding: 10px 14px; opacity: .25; font-size: 13px; }
      #overlay.photo > :not(#show-ui) { visibility: hidden; }
      #overlay.photo #show-ui { display: block; }
      #overlay .bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="viewer">
      <div id="clips"></div>
      <div class="bottom">
        <button id="start-ar" disabled>AR 시작</button>
        <span id="status" class="chip">불러오는 중…</span>
      </div>
    </div>

    <div id="overlay" hidden>
      <div id="hint" class="chip">바닥을 천천히 비춰 보세요</div>
      <div class="bar">
        <button id="come" hidden>이리 와</button>
        <button id="dance" hidden>춤 춰</button>
        <button id="photo" class="alt" hidden>촬영 모드</button>
        <button id="replace" class="alt" hidden>다시 놓기</button>
        <button id="exit" class="alt">종료</button>
      </div>
      <button id="show-ui" class="alt" aria-label="버튼 다시 보이기">UI</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
