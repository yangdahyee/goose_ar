<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Duck AR</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800&display=swap" />
    <style>
      :root {
        --orange: #f08a2e; --orange-d: #c9661a; --cream: #fff6e6; --ink: #2b2118; --bg: #eef3f6;
        /* frosted glass: heavy blur, a milky neutral veil, a thin light edge */
        --glass: linear-gradient(160deg, rgba(255, 255, 255, .20), rgba(255, 255, 255, .06)), rgba(112, 108, 100, .30);
        --glass-border: rgba(255, 255, 255, .30); --glass-hi: rgba(255, 255, 255, .38);
        --glass-blur: blur(26px) saturate(1.15);
        --glass-ink: rgba(255, 255, 255, .74); /* icons: not pure white, so they sit inside the glass */
        /* hat-blue glass for the main action */
        --hat-glass: linear-gradient(160deg, rgba(210, 236, 252, .78), rgba(118, 178, 228, .72)), rgba(120, 172, 218, .2);
        --font-ui: 'Nunito', system-ui, sans-serif; --font-cute: 'Jua', 'Nunito', system-ui, sans-serif;
      }
      [hidden] { display: none !important; } /* id rules below set display and would override it */
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
      body { font: 14px/1.4 var(--font-ui); color: var(--ink); }
      #app { position: fixed; inset: 0; }
      button { font-family: var(--font-ui); cursor: pointer; border: 0; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .glass { background: var(--glass); border: 1px solid var(--glass-border); color: #fff;
        -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
        box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(255, 255, 255, .08), 0 8px 28px rgba(0, 0, 0, .18); }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .glass { background: rgba(84, 80, 74, .66); } #come, #start-ar { background: rgba(86, 140, 190, .82); }
      }
      /* the plain 3D viewer sits on a light background, so its glass is a little darker for contrast */
      #viewer .glass { background: rgba(72, 68, 62, .55); }
      .chip { padding: 8px 14px; border-radius: 99px; font-weight: 800; }

      /* ---- normal 3D viewer ---- */
      #viewer { position: fixed; inset: 0; pointer-events: none; box-sizing: border-box; padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; justify-content: space-between; }
      #viewer > * { pointer-events: auto; }
      #clips { display: flex; gap: 8px; flex-wrap: wrap; }
      #clips button { padding: 10px 16px; border-radius: 99px; font-weight: 800; }
      #viewer .bottom { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      #start-ar { padding: 14px 24px; border-radius: 99px; color: #fff; font: 400 20px var(--font-cute);
        background: var(--hat-glass); border: 1px solid rgba(255, 255, 255, .5);
        -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); text-shadow: 0 1px 4px rgba(24, 60, 96, .45);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 8px 24px rgba(60, 110, 160, .3); }
      #start-ar:disabled { opacity: .5; box-shadow: none; }

      /* ---- AR overlay (WebXR dom-overlay root). Design C: one big call button + thumb rail ---- */
      #overlay { position: fixed; inset: 0; pointer-events: none; font-family: var(--font-ui); }
      #overlay > * { pointer-events: auto; }
      #overlay .x { position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left));
        width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; }
      #overlay .x svg { width: 20px; height: 20px; }
      #hint { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
        max-width: calc(100% - 140px); text-align: center; white-space: nowrap; font-size: 15px; pointer-events: none; }
      #overlay .rail { position: absolute; right: max(14px, env(safe-area-inset-right));
        bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); display: flex; flex-direction: column; gap: 12px; }
      #overlay .rail button { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; transition: transform .12s; }
      #overlay .rail button, #overlay .x { color: var(--glass-ink); }
      #overlay .rail svg, #overlay .x svg { stroke-width: 1.8; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .16)); }
      #overlay .rail button:active { transform: scale(.9); }
      #overlay .rail svg { width: 26px; height: 26px; }
      #come { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%);
        padding: 17px 48px; border-radius: 99px; white-space: nowrap; color: #fff; font: 400 26px var(--font-cute);
        background: var(--hat-glass); border: 1px solid rgba(255, 255, 255, .5);
        -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
        text-shadow: 0 1px 4px rgba(24, 70, 120, .5);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -1px 0 rgba(255, 255, 255, .14), 0 10px 28px rgba(60, 120, 180, .38);
        transition: transform .12s; }
      #come:active { transform: translateX(-50%) scale(.95); }
      #come.busy { animation: breath 1.1s ease-in-out infinite; }
      @keyframes breath { 50% { transform: translateX(-50%) scale(1.045); } }
      /* photo mode: nothing visible except a faint corner button that brings the UI back */
      #show-ui { display: none; position: absolute; right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom)); padding: 10px 14px; border-radius: 99px; opacity: .35; font-size: 13px; font-weight: 800; }
      #overlay.photo > :not(#show-ui) { visibility: hidden; }
      #overlay.photo #show-ui { display: block; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
        <symbol id="i-cam" viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H8l1.4-2h5.2L16 6h2.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 20v-5h-5"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      </defs>
    </svg>

    <div id="app"></div>

    <div id="viewer">
      <div id="clips"></div>
      <div class="bottom">
        <button id="start-ar" disabled>AR 시작</button>
        <span id="status" class="chip glass">불러오는 중…</span>
      </div>
    </div>

    <div id="overlay" hidden>
      <button id="exit" class="x glass" aria-label="종료"><svg class="ic"><use href="#i-x" /></svg></button>
      <div id="hint" class="chip glass">바닥을 천천히 비춰 보세요</div>
      <div class="rail">
        <button id="dance" class="glass" aria-label="춤 춰" hidden><svg class="ic"><use href="#i-note" /></svg></button>
        <button id="photo" class="glass" aria-label="촬영 모드" hidden><svg class="ic"><use href="#i-cam" /></svg></button>
        <button id="replace" class="glass" aria-label="다시 놓기" hidden><svg class="ic"><use href="#i-redo" /></svg></button>
      </div>
      <button id="come" hidden><span id="come-label">이리 와</span></button>
      <button id="show-ui" class="glass">UI</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
