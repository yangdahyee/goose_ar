<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Duck AR</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800&display=swap" />
    <style>
      :root {
        --orange: #f08a2e; --orange-d: #c9661a; --cream: #fff6e6; --ink: #2b2118; --bg: #eef3f6;
        --font-ui: 'Nunito', system-ui, sans-serif; --font-cute: 'Jua', 'Nunito', system-ui, sans-serif;
      }
      [hidden] { display: none !important; } /* id rules below set display and would override it */
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
      body { font: 14px/1.4 var(--font-ui); color: var(--ink); }
      #app { position: fixed; inset: 0; }
      button { font-family: var(--font-ui); cursor: pointer; border: 0; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .chip { padding: 8px 14px; border-radius: 99px; background: rgba(255, 246, 230, .92); font-weight: 800; }

      /* ---- normal 3D viewer ---- */
      #viewer { position: fixed; inset: 0; pointer-events: none; box-sizing: border-box; padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; justify-content: space-between; }
      #viewer > * { pointer-events: auto; }
      #clips { display: flex; gap: 8px; flex-wrap: wrap; }
      #clips button { padding: 10px 16px; border-radius: 99px; background: var(--cream); color: var(--ink); font-weight: 800; }
      #viewer .bottom { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      #start-ar { padding: 14px 22px; border-radius: 99px; background: linear-gradient(180deg, #ffa24d, var(--orange-d)); color: #fff;
        font: 400 20px var(--font-cute); box-shadow: 0 6px 16px rgba(201, 102, 26, .45); }
      #start-ar:disabled { opacity: .5; box-shadow: none; }

      /* ---- AR overlay (WebXR dom-overlay root). Design C: one big call button + thumb rail ---- */
      #overlay { position: fixed; inset: 0; pointer-events: none; font-family: var(--font-ui); }
      #overlay > * { pointer-events: auto; }
      #overlay .x { position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left));
        width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(23, 18, 13, .45); color: #fff; }
      #overlay .x svg { width: 20px; height: 20px; }
      #hint { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
        max-width: calc(100% - 140px); text-align: center; white-space: nowrap; font-size: 15px; pointer-events: none; }
      #overlay .rail { position: absolute; right: max(14px, env(safe-area-inset-right));
        bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); display: flex; flex-direction: column; gap: 12px; }
      #overlay .rail button { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
        background: rgba(255, 246, 230, .94); color: var(--ink); box-shadow: 0 3px 10px rgba(0, 0, 0, .28); transition: transform .12s; }
      #overlay .rail button:active { transform: scale(.9); }
      #overlay .rail svg { width: 26px; height: 26px; }
      #come { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px; padding: 12px 30px 12px 14px; border-radius: 99px; white-space: nowrap;
        background: linear-gradient(180deg, #ffa24d, var(--orange-d)); color: #fff; font: 400 24px var(--font-cute);
        box-shadow: 0 7px 18px rgba(201, 102, 26, .55), inset 0 1px 0 rgba(255, 255, 255, .5); transition: transform .12s; }
      #come i { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .25); }
      #come svg { width: 28px; height: 28px; }
      #come:active { transform: translateX(-50%) scale(.95); }
      #come.busy i { animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(1.1); } }
      /* photo mode: nothing visible except a faint corner button that brings the UI back */
      #show-ui { display: none; position: absolute; right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom)); padding: 10px 14px; border-radius: 99px; opacity: .3; font-size: 13px; font-weight: 800;
        background: rgba(255, 255, 255, .7); color: var(--ink); }
      #overlay.photo > :not(#show-ui) { visibility: hidden; }
      #overlay.photo #show-ui { display: block; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-foot" viewBox="0 0 24 24"><path d="M12 3.2 4.6 15.4c-.4.7 0 1.4.7 1.7 2 .9 4 .9 6.7-.3 2.7 1.2 4.7 1.2 6.7.3.7-.3 1.1-1 .7-1.7L12 3.2z" fill="currentColor" stroke="none"/><path d="M12 16.6V8M12 16.6 8.4 10.6M12 16.6l3.6-6" stroke="rgba(0,0,0,.28)" stroke-width="1.6" fill="none"/></symbol>
        <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
        <symbol id="i-cam" viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H8l1.4-2h5.2L16 6h2.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 20v-5h-5"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      </defs>
    </svg>

    <div id="app"></div>

    <div id="viewer">
      <div id="clips"></div>
      <div class="bottom">
        <button id="start-ar" disabled>AR 시작</button>
        <span id="status" class="chip">불러오는 중…</span>
      </div>
    </div>

    <div id="overlay" hidden>
      <button id="exit" class="x" aria-label="종료"><svg class="ic"><use href="#i-x" /></svg></button>
      <div id="hint" class="chip">바닥을 천천히 비춰 보세요</div>
      <div class="rail">
        <button id="dance" aria-label="춤 춰" hidden><svg class="ic"><use href="#i-note" /></svg></button>
        <button id="photo" aria-label="촬영 모드" hidden><svg class="ic"><use href="#i-cam" /></svg></button>
        <button id="replace" aria-label="다시 놓기" hidden><svg class="ic"><use href="#i-redo" /></svg></button>
      </div>
      <button id="come" hidden><i><svg class="ic"><use href="#i-foot" /></svg></i><span id="come-label">이리 와</span></button>
      <button id="show-ui">UI</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
